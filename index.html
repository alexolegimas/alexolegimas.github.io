<!DOCTYPE html>
<html lang="en" data-design="index">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alex Imas</title>
  <meta name="description" content="Alex Imas — Director of AGI Economics at Google DeepMind and Roger L. and Rachel M. Goetz Professor of Behavioral Science, Economics, and Applied AI at the University of Chicago Booth School of Business." />
  <link rel="stylesheet" href="static/css/styles.css" />
</head>
<body>

  <div class="page-shell">
    <!-- Top Header / Profile & Bio -->
    <header class="site-intro" id="site-intro"></header>

    <!-- Main Content Column -->
    <main>
      <!-- Category Filter + Search + Expand All Abstracts Bar -->
      <div class="controls-bar">
        <div class="topic-filter-bar" id="topic-filter-bar" aria-label="Filter by Research Category"></div>
        <div class="utility-actions">
          <input type="search" id="search-input" class="search-input" placeholder="Search papers, coauthors..." aria-label="Search papers" />
          <button type="button" id="expand-all-btn" class="expand-all-btn">Expand All Abstracts</button>
        </div>
      </div>

      <!-- Dynamic Sections (01 Books through 08 Teaching) -->
      <div id="sections-container"></div>

      <footer class="minimal-footer">
        <span>Alex Imas</span>
        <span>Google DeepMind &amp; University of Chicago Booth School of Business · 2026</span>
      </footer>
    </main>
  </div>

  <script src="static/js/data.js"></script>
  <script src="static/js/app.js"></script>
</body>
</html>
